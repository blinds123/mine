name: Starburst image model comparison

on:
  push:
    branches:
      - starburst-imagegen-20260820
    paths:
      - .github/workflows/starburst-image-test.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/starburst-image-test.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: starburst-imagegen-20260820
      - name: Compare image models on one exact scene
        shell: bash
        run: |
          set -u
          rm -rf model-test
          mkdir -p model-test
          PROMPT='One standalone vertical 4:5 photorealistic luxury ecommerce product photograph of the exact reference silver Star Burst Charm Necklace only. Lay the complete necklace naturally on warm cream silk satin. The polished round pendant with radiating starburst face, small upper crystal and delicate silver chain must match the reference image. Pendant centered, chain visible, soft natural window light, macro jewelry photography, realistic metal reflections. ABSOLUTELY NO PERSON, NO FACE, NO BODY, NO MANNEQUIN, NO PHONE, NO PACKAGING, NO WRITING, NO UI, NO COLLAGE, NO GRID, NO ADDITIONAL PANEL, NO OTHER JEWELRY, NO ILLUSTRATION, NO ANIME.'
          REF='https://invisawear.com/cdn/shop/files/Necklace_Silver_StarBurst_A2.jpg?v=1767130473&width=1346'
          ENCODED=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$PROMPT")
          REF_ENCODED=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$REF")
          MODELS=(gptimage gptimage-large seedream nanobanana kontext flux zimage)
          for MODEL in "${MODELS[@]}"; do
            echo "=== $MODEL ==="
            URL="https://image.pollinations.ai/prompt/${ENCODED}?width=768&height=960&seed=42001&nologo=true&model=${MODEL}&safe=true&image=${REF_ENCODED}"
            if curl --fail --location --retry 3 --retry-delay 8 --max-time 900 "$URL" --output "model-test/${MODEL}.jpg"; then
              if test -s "model-test/${MODEL}.jpg"; then
                file "model-test/${MODEL}.jpg" || true
              else
                rm -f "model-test/${MODEL}.jpg"
              fi
            else
              echo "$MODEL failed" | tee "model-test/${MODEL}.failed.txt"
              rm -f "model-test/${MODEL}.jpg"
            fi
            sleep 5
          done
          ls -lh model-test
      - name: Upload model comparison
        uses: actions/upload-artifact@v4
        with:
          name: starburst-model-comparison
          path: model-test/
          if-no-files-found: error
          retention-days: 1
