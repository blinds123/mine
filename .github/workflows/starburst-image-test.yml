name: Starburst Hugging Face image edit test

on:
  push:
    branches:
      - starburst-imagegen-20260820
    paths:
      - .github/workflows/starburst-image-test.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/starburst-image-test.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: starburst-imagegen-20260820
      - name: Call public FLUX Kontext Space
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hf-test
          mkdir -p hf-test
          python3 -m pip install --quiet --upgrade gradio_client pillow
          python3 - <<'PY'
          from gradio_client import Client, handle_file
          from pathlib import Path
          import json, shutil

          space = "mcp-tools/FLUX.1-Kontext-Dev"
          client = Client(space)
          api = client.view_api(return_format="dict")
          Path("hf-test/api.json").write_text(json.dumps(api, indent=2, default=str))
          print(json.dumps(api, indent=2, default=str))

          ref = "https://invisawear.com/cdn/shop/files/Necklace_Silver_StarBurst_A2.jpg?v=1767130473&width=1346"
          prompt = (
              "Preserve the exact silver Star Burst Charm Necklace and its geometry. "
              "Change only the setting into a premium vertical ecommerce product photo: place the complete necklace on warm cream silk satin, "
              "full chain visible, pendant centered, soft natural window light, realistic polished silver reflections. "
              "No person, no face, no body, no phone, no packaging, no text, no collage, no extra jewelry."
          )
          result = client.predict(
              handle_file(ref),
              prompt,
              44001,
              False,
              2.5,
              22,
              api_name="/infer",
          )
          print("RESULT", result)
          image_path = result[0] if isinstance(result, (list, tuple)) else result
          shutil.copy2(str(image_path), "hf-test/IMG-01.png")
          PY
          file hf-test/IMG-01.png
      - name: Upload HF image test
        uses: actions/upload-artifact@v4
        with:
          name: starburst-hf-image-test
          path: hf-test/
          if-no-files-found: error
          retention-days: 1
